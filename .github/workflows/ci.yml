# CI：三平台 × Python 3.12 全量单测。
# Windows/Linux 腿保证的是「代码路径与测试可移植」；EC20 真机行为仍待硬件验证。
name: CI

on:
  push:
  pull_request:

# 同一 ref 的新提交取消进行中的旧跑，省 runner 排队时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-package:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml
      - name: Install packaging dependencies
        # [local] bundles sherpa-onnx into the portable Windows build (AGENT_PROVIDER=local default).
        run: python -m pip install ".[local]" "pyinstaller>=6.11,<7" "pyinstaller-hooks-contrib>=2025.1" "pillow>=11,<13" "pythonnet>=3,<4"
      - name: Build
        run: |
          # CallPilot.ico is committed; its .icns source is a gitignored local asset
          # (regenerate locally with scripts/windows/generate_icon.py when the icon changes).
          if (-not (Test-Path packaging/CallPilot.ico)) { throw "packaging/CallPilot.ico missing" }
          $env:PYTHON = (Get-Command python).Source
          & scripts/windows/build_app.ps1
      - name: Relocated EXE headless selftest
        timeout-minutes: 2
        run: |
          $check = Join-Path $env:RUNNER_TEMP 'CallPilot smoke test'
          New-Item -ItemType Directory -Force $check | Out-Null
          Copy-Item dist/CallPilot (Join-Path $check 'CallPilot') -Recurse
          $env:CALLPILOT_SELFTEST_REPORT = Join-Path $check 'selftest.json'
          $env:AGENTCALL_APP_SUPPORT_DIR = Join-Path $check 'support'
          $env:PYTHONPATH = ''
          $process = Start-Process -FilePath (Join-Path $check 'CallPilot/CallPilot.exe') -ArgumentList '--selftest' -WorkingDirectory $check -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Selftest timed out after 60 seconds'
          }
          $report = Get-Content $env:CALLPILOT_SELFTEST_REPORT -Raw | ConvertFrom-Json
          Get-Content $env:CALLPILOT_SELFTEST_REPORT
          if ($process.ExitCode -ne 0) { throw "Selftest exit=$($process.ExitCode)" }
          if (-not $report.ok -or -not $report.frozen -or $report.platform -ne 'win32') {
            throw 'Invalid frozen selftest report'
          }
          Copy-Item $env:CALLPILOT_SELFTEST_REPORT dist/CallPilot/selftest.json
      - name: Zip portable app
        run: Compress-Archive -Path dist/CallPilot -DestinationPath dist/CallPilot-windows-x64.zip
      - name: Portable backend smoke test (no hardware)
        timeout-minutes: 4
        run: scripts/windows/test_portable.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CallPilot-windows-x64
          path: dist/CallPilot-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # ".[dev]" 必须带双引号：裸 .[dev] 在部分 shell 里会被当 glob 展开；
      # 双引号在 bash 与 pwsh（Windows 默认 shell）下行为一致。
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        # 挂死/极慢的腿要在 10 分钟内以失败收场并打印用例名，而不是占满 6 小时
        # 真实 Cocoa 子进程测试默认跳过（开发机上会闪窗口），CI 里显式打开以保留覆盖。
        env:
          CALLPILOT_GUI_TESTS: "1"
        run: pytest -q --timeout 600 --durations=25
